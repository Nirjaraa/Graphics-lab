<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DNA & RNA 3D Visualization</title>

<style>
body { margin: 0; overflow: hidden; }
.label {
  position: absolute;
  font-size: 14px;
  font-family: Arial, sans-serif;
  color: black;
  pointer-events: none;
}
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 50;

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404040));
var light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);

var colors = {
  A: 0x2ecc71,
  T: 0xe74c3c,
  U: 0x9b59b6,
  C: 0x3498db,
  G: 0xf1c40f
};

var backboneMaterial = new THREE.MeshPhongMaterial({ color: 0xd9d9d9 });
var materials = {};
Object.keys(colors).forEach(k => {
  materials[k] = new THREE.MeshPhongMaterial({ color: colors[k] });
});

var tubeGeometry = new THREE.CylinderGeometry(0.3, 0.3, 6, 32);
var ballGeometry = new THREE.SphereGeometry(0.8, 32, 32);

var holder = new THREE.Object3D();
scene.add(holder);

var labeledObjects = [];

function createLabel(text) {
  var div = document.createElement("div");
  div.className = "label";
  div.innerHTML = text;
  document.body.appendChild(div);
  return div;
}

function clearScene() {
  holder.clear();
  labeledObjects.forEach(o => o.label.remove());
  labeledObjects = [];
}

function createDNA() {
  var dna = new THREE.Object3D();
  dna.position.y = -40;

  for (let i = 0; i <= 40; i++) {
    let row = new THREE.Object3D();

    let leftTube = new THREE.Mesh(tubeGeometry, backboneMaterial);
    let rightTube = new THREE.Mesh(tubeGeometry, backboneMaterial);
    leftTube.rotation.z = rightTube.rotation.z = Math.PI / 2;
    leftTube.position.x = -3;
    rightTube.position.x = 3;

    let leftBase, rightBase, lLabel, rLabel;

    if (i % 2 === 0) {
      leftBase = new THREE.Mesh(ballGeometry, materials.A);
      rightBase = new THREE.Mesh(ballGeometry, materials.T);
      lLabel = createLabel("A");
      rLabel = createLabel("T");
    } else {
      leftBase = new THREE.Mesh(ballGeometry, materials.C);
      rightBase = new THREE.Mesh(ballGeometry, materials.G);
      lLabel = createLabel("C");
      rLabel = createLabel("G");
    }

    leftBase.position.x = -6;
    rightBase.position.x = 6;

    labeledObjects.push({ mesh: leftBase, label: lLabel });
    labeledObjects.push({ mesh: rightBase, label: rLabel });

    row.add(leftTube, rightTube, leftBase, rightBase);
    row.position.y = i * 2;
    row.rotation.y = i * 0.52;

    dna.add(row);
  }
  holder.add(dna);
}

function createRNA() {
  var rna = new THREE.Object3D();
  rna.position.y = -40;

  var bases = ["A", "U", "C", "G"];

  for (let i = 0; i <= 40; i++) {
    let row = new THREE.Object3D();

    let tube = new THREE.Mesh(tubeGeometry, backboneMaterial);
    tube.rotation.z = Math.PI / 2;

    let baseType = bases[i % bases.length];
    let base = new THREE.Mesh(ballGeometry, materials[baseType]);
    base.position.x = 4;

    let label = createLabel(baseType);
    labeledObjects.push({ mesh: base, label: label });

    row.add(tube, base);
    row.position.y = i * 2;
    row.rotation.y = i * 0.35;

    rna.add(row);
  }
  holder.add(rna);
}

var controls = {
  molecule: "DNA",
  autoRotate: true,
  zoom: 50
};

var gui = new dat.GUI();
gui.add(controls, "molecule", ["DNA", "RNA"]).onChange(() => {
  clearScene();
  controls.molecule === "DNA" ? createDNA() : createRNA();
});
gui.add(controls, "autoRotate");
gui.add(controls, "zoom", 20, 120).onChange(v => camera.position.z = v);
gui.close();

createDNA();

var dragging = false, px = 0, py = 0;

document.onmousedown = e => {
  if (!controls.autoRotate) {
    dragging = true;
    px = e.clientX;
    py = e.clientY;
  }
};

document.onmousemove = e => {
  if (dragging) {
    holder.rotation.y += (e.clientX - px) * 0.005;
    holder.rotation.x += (e.clientY - py) * 0.005;
    px = e.clientX;
    py = e.clientY;
  }
};

document.onmouseup = () => dragging = false;

function animate() {
  requestAnimationFrame(animate);

  if (controls.autoRotate) holder.rotation.y += 0.01;

  labeledObjects.forEach(item => {
    let pos = item.mesh.getWorldPosition(new THREE.Vector3());
    pos.project(camera);

    let x = (pos.x * 0.5 + 0.5) * window.innerWidth;
    let y = (-pos.y * 0.5 + 0.5) * window.innerHeight;

    item.label.style.left = x + "px";
    item.label.style.top = y + "px";
  });

  renderer.render(scene, camera);
}
animate();

window.onresize = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
</script>

</body>
</html>
